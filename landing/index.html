  <style>
    /* ---------- Brand theme (overrides engine @layer sw cleanly) ---------- */
    :root, .sw-root {
      --sw-bg: #0f0e13;           /* dark = premium for photoreal full-bleed */
      --sw-ink: #f5f1e8;          /* light ink on dark */
      --sw-ink-soft: #b9b2a4;
      --sw-accent: #c8a24a;       /* desert gold; per-section accents override */
      --sw-font-sans: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
    }
    html, body { margin:0; background:#0f0e13; }
    body { font-family: var(--sw-font-sans); }

    /* ---------- RTL flips (my CSS is unlayered → beats @layer sw) ---------- */
    /* Copy block: engine anchors it left; move to the right for Arabic */
    .sw-copy{
      left:auto !important;
      right:clamp(18px,5vw,64px) !important;
      text-align:right;
    }
    @media (max-width:860px){
      .sw-copy{ left:clamp(18px,5vw,64px) !important; right:clamp(18px,5vw,64px) !important; }
    }
    /* Route rail: engine pins it right; move to the left in RTL */
    .sw-route{ right:auto !important; left:clamp(14px,2.4vw,30px) !important; }
    .sw-route__label{ right:auto !important; left:24px; }
    @media (max-width:860px){ .sw-route{ left:6px !important; } }

    /* Typography polish for Arabic */
    .sw-copy__title{ font-weight:700; line-height:1.25; letter-spacing:0; }
    .sw-copy__eyebrow{ font-weight:600; letter-spacing:0; }
    .sw-copy__num{ direction:ltr; unicode-bidi:isolate; }   /* keep "01 / 06" order in RTL */
    .sw-copy__body{ font-weight:400; }
    .sw-brand__name{ font-weight:700; }

    /* Email capture on the finale */
    .laqta-notify{ display:flex; gap:8px; margin-top:14px; max-width:360px; }
    .laqta-notify input{
      flex:1; padding:11px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.06); color:#f5f1e8; font-family:inherit; font-size:.95rem;
      text-align:right;
    }
    .laqta-notify input::placeholder{ color:#b9b2a4; }
    .laqta-notify button{
      padding:11px 18px; border-radius:999px; border:none; cursor:pointer;
      background:#c8a24a; color:#14141a; font-family:inherit; font-weight:700; font-size:.95rem;
    }
    .laqta-msg{ margin-top:8px; font-size:.82rem; color:#c8a24a; min-height:1em; }
  </style>

    /* ---- notify-me email capture injected into the finale copy ---- */
    (function () {
      function inject() {
        var finale = document.querySelectorAll('.sw-copy');
        if (!finale.length) { return setTimeout(inject, 300); }
        var last = finale[finale.length - 1];
        if (last.querySelector('.laqta-notify')) return;
        var wrap = document.createElement('div');
        wrap.innerHTML =
          '<form class="laqta-notify" onsubmit="return laqtaNotify(event)">' +
          '<input type="email" required placeholder="بريدك الإلكتروني للتنبيه عند الإطلاق" aria-label="البريد الإلكتروني">' +
          '<button type="submit">أعلِمني</button></form>' +
          '<div class="laqta-msg" id="laqta-msg"></div>';
        last.appendChild(wrap);
      }
      inject();
      window.laqtaNotify = function (e) {
        e.preventDefault();
        document.getElementById('laqta-msg').textContent = 'شكراً! سنراسلك عند الإطلاق.';
        e.target.reset();
        return false;
      };
    })();
  </script>
